server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Relative redirect to preserve custom port and domain
    absolute_redirect off;

    # Backward-compatible redirect for root HTML requests to /pages/
    rewrite ^/(about|service|articles|article|contact|project-.*)\.html$ /pages/$1.html permanent;

    # Backward-compatible redirect for legacy root CSS/JS and assets
    rewrite ^/style\.css$ /assets/css/style.css permanent;
    rewrite ^/script\.js$ /assets/js/script.js permanent;
    rewrite ^/assets/logo\.png$ /assets/brand/logo.png permanent;
    rewrite ^/assets/logo-banner\.png$ /assets/brand/logo-banner.png permanent;
    rewrite ^/assets/indonesia-map(-light)?\.svg$ /assets/maps/indonesia-map$1.svg permanent;
    rewrite ^/assets/project-(.*)(-light)?\.svg$ /assets/projects/showcases/project-$1$2.svg permanent;

    location / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # SEO & Crawlers
    location = /robots.txt {
        default_type text/plain;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        access_log off;
        log_not_found off;
    }

    # Cache static assets
    location ~* \.(svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location ~* \.(css|js)$ {
        expires -1;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Security headers
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-XSS-Protection "1; mode=block";
}
