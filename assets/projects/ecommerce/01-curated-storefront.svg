<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="100%" stop-color="#0e0e12" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="750" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
    <line x1="1140" y1="0" x2="1140" y2="750" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="0" y1="680" x2="1200" y2="680" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="710" rx="6" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Window Header -->
  <rect x="20" y="20" width="1160" height="48" rx="6" fill="#0d0d11" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <circle cx="48" cy="44" r="5" fill="#ff5f56" opacity="0.8" />
  <circle cx="68" cy="44" r="5" fill="#ffbd2e" opacity="0.8" />
  <circle cx="88" cy="44" r="5" fill="#27c93f" opacity="0.8" />

  <!-- URL Address Bar -->
  <rect x="360" y="32" width="480" height="24" rx="4" fill="#050507" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="600" y="48" fill="#777777" font-family="monospace" font-size="11" text-anchor="middle">https://preview.mayastranawaloka.com/e-commerce/curated-storefront</text>

  <!-- Window Status Badge -->
  <rect x="1060" y="34" width="90" height="20" rx="2" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <text x="1105" y="48" fill="#ffffff" font-family="monospace" font-size="9" text-anchor="middle" letter-spacing="1">LIVE PROD</text>

  <!-- Main View Header Inside Mockup -->
  <g transform="translate(50, 95)">
    <text x="0" y="0" fill="#666666" font-family="monospace" font-size="11" letter-spacing="2">E-COMMERCE // ARCHITECTURE PREVIEW</text>
    <text x="0" y="28" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="24" letter-spacing="-0.5">Curated Storefront</text>
    <text x="0" y="48" fill="#999999" font-family="'Space Grotesk', sans-serif" font-size="13">Minimalist luxury retail experience &amp; featured drops</text>
  </g>

  <!-- Detailed Mockup Content -->
  
   <g transform="translate(50, 165)">
     <rect width="1100" height="500" rx="4" fill="#0a0a0e" stroke="rgba(255,255,255,0.08)" />
     <text x="40" y="60" fill="#fff" font-family="sans-serif" font-size="28" font-weight="700">MONOCHROME STUDIO OBJECTS</text>
     <text x="40" y="90" fill="#888" font-size="13">Direct-to-consumer artisanal home and studio instruments.</text>
     <g transform="translate(40, 120)">
       <rect width="320" height="320" rx="4" fill="#14141c" />
       <circle cx="160" cy="140" r="60" fill="#222" />
       <text x="24" y="260" fill="#fff" font-weight="600">Matte Obsidian Vessel</text>
       <text x="24" y="285" fill="#aaa" font-family="monospace">Rp 520.000</text>
     </g>
     <g transform="translate(390, 120)">
       <rect width="320" height="320" rx="4" fill="#14141c" />
       <rect x="110" y="90" width="100" height="100" fill="#222" />
       <text x="24" y="260" fill="#fff" font-weight="600">Acoustic Wool Desk Mat</text>
       <text x="24" y="285" fill="#aaa" font-family="monospace">Rp 390.000</text>
     </g>
     <g transform="translate(740, 120)">
       <rect width="320" height="320" rx="4" fill="#14141c" />
       <polygon points="160,80 220,190 100,190" fill="#222" />
       <text x="24" y="260" fill="#fff" font-weight="600">Brass Geometric Bookend</text>
       <text x="24" y="285" fill="#aaa" font-family="monospace">Rp 890.000</text>
     </g>
   </g>
   

  <!-- Footer Meta Ribbon -->
  <g transform="translate(50, 705)">
    <text x="0" y="0" fill="#555555" font-family="monospace" font-size="10" letter-spacing="1">PT MAYASTRA NAWALOKA NUSANTARA // HIGH-ASSURANCE SYSTEMS</text>
    <text x="1100" y="0" fill="#555555" font-family="monospace" font-size="10" text-anchor="end" letter-spacing="1">TYPE-SAFE // DOCKERIZED // SECURE</text>
  </g>
</svg>