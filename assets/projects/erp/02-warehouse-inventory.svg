<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="100%" stop-color="#0e0e12" />
    </linearGradient>
    <linearGradient id="accentLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05" />
    </linearGradient>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="750" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid -->
  <g stroke="rgba(255,255,255,0.03)" stroke-width="1">
    <line x1="60" y1="0" x2="60" y2="750" />
    <line x1="240" y1="0" x2="240" y2="750" />
    <line x1="600" y1="0" x2="600" y2="750" />
    <line x1="960" y1="0" x2="960" y2="750" />
    <line x1="1140" y1="0" x2="1140" y2="750" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="460" x2="1200" y2="460" />
    <line x1="0" y1="680" x2="1200" y2="680" />
  </g>

  <!-- Frame Border -->
  <rect x="20" y="20" width="1160" height="710" rx="6" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Window Header -->
