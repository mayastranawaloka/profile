       <text x="780" y="20" fill="#888" font-family="monospace" font-size="13">600 pcs</text>
       <text x="960" y="20" fill="#facc15" font-family="monospace" font-size="11">LOW STOCK</text>
     </g>
     <line x1="30" y1="275" x2="1070" y2="275" stroke="rgba(255,255,255,0.06)" />
     <g transform="translate(30, 295)">
       <text x="16" y="20" fill="#fff" font-family="monospace" font-size="12">SKU-5520-D</text>
