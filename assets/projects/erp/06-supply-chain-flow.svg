    <rect x="1195" y="8" width="105" height="34" rx="4" fill="#ffffff"/>
    <text x="1247" y="30" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Schedule Transfer</text>
