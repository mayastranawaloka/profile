  <!-- Editorial Top Bar -->
  <g transform="translate(280, 80)">
    <text x="0" y="24" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Articles / #8901 / Revisions / Compare Rev #42 vs Rev #41</text>
    <rect x="850" y="4" width="110" height="34" rx="4" fill="#18181b" stroke="#27272a" stroke-width="1"/>
    <text x="905" y="26" fill="#d4d4d8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="middle">Revert to #41</text>

