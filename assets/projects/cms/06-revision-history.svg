<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#09090b"/>

  <!-- Browser Header Bar -->
  <rect width="1600" height="52" fill="#121215" stroke="#27272a" stroke-width="1"/>
