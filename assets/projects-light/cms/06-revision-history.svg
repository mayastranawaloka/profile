        <text x="240" y="24" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Updated layout schematics &amp; edge synchronization details</text>
        <text x="800" y="24" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Lead Engineer</text>
        <text x="1000" y="24" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Today, 00:32 UTC+7</text>

        <text x="0" y="64" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Rev #41</text>
        <text x="240" y="64" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Added executive summary &amp; Jonathan Ive industrial quote</text>
        <text x="800" y="64" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Managing Editor</text>
        <text x="1000" y="64" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Yesterday, 18:20 UTC+7</text>

        <text x="0" y="104" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Rev #40</text>
        <text x="240" y="104" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Initial draft submission for architectural peer review</text>
        <text x="800" y="104" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Staff Writer</text>
        <text x="1000" y="104" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Nov 12, 11:15 UTC+7</text>
