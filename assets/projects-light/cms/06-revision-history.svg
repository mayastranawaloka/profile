        <text x="0" y="24" fill="#71717a" font-family="monospace" font-size="12">14</text>
        <text x="36" y="24" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Modern enterprise systems require efficient data layouts.</text>

