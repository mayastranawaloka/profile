    <!-- Content Paragraphs -->
    <text x="40" y="480" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" line-height="24">Modern enterprise applications require high-precision information density without perceptual</text>
    <text x="40" y="508" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">clutter. By utilizing strict monochromatic typography, intentional whitespace, and zero superfluous</text>
    <text x="40" y="536" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15">embellishments, digital operations achieve instantaneous user comprehension.</text>

    <!-- Quote Block -->
