    <text x="60" y="595" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="15" font-style="italic">"Simplicity is not the absence of clutter, that's a consequence of simplicity."</text>
    <text x="60" y="620" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Jonathan Ive, Industrial Architecture</text>

    <!-- Structured Data Subheader -->
    <text x="40" y="675" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700">Core Infrastructure Deliverables</text>
    <text x="40" y="710" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">1. Autonomous CMS synchronization with edge caching layers.</text>
    <text x="40" y="735" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">2. Zero latency content delivery network with automated asset compression.</text>
    <text x="40" y="760" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14">3. Granular RBAC permissions for enterprise editorial departments.</text>
