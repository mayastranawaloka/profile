          <text x="0" y="70" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">Singapore (APAC Tech Hub)</text>
          <text x="368" y="70" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="end">14%</text>

          <text x="0" y="116" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">United States (West Coast &amp; NYC)</text>
          <text x="368" y="116" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" text-anchor="end">10%</text>

          <text x="0" y="162" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">European Union &amp; Other</text>
