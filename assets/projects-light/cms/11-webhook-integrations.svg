      <text x="676" y="28" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">GLOBAL PURGE TIME</text>
      <text x="676" y="66" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="28" font-weight="800">&lt; 50 ms</text>
      <text x="820" y="66" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Edge Propagation</text>

      <rect x="978" y="0" width="302" height="96" rx="4" fill="#111114" stroke="#e4e4e7" stroke-width="1"/>
      <text x="1002" y="28" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">DELIVERY RETRY SLA</text>
