        <text x="24" y="52" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">https://cdn.mayastranawaloka.com/hooks/rebuild-rss</text>
        <rect x="440" y="26" width="130" height="24" rx="4" fill="#18181c" stroke="#e4e4e7" stroke-width="1"/>
        <text x="505" y="42" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">article.all_events</text>
        <text x="740" y="42" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">HMAC-SHA256</text>
        <text x="960" y="42" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Nov 12 11:15 (8ms)</text>
        <rect x="1150" y="26" width="90" height="24" rx="4" fill="#09090b" fill-opacity="0.12"/>
        <text x="1195" y="42" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">200 OK</text>
      </g>
