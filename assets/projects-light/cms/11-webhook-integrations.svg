      <rect x="0" y="0" width="1280" height="120" rx="6" fill="#111114" stroke="#e4e4e7" stroke-width="1"/>
      <text x="24" y="32" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700">WEBHOOK SECURITY &amp; RETRY CONFIGURATION</text>
      <line x1="24" y1="46" x2="1256" y2="46" stroke="#e4e4e7" stroke-width="1"/>
      <text x="24" y="72" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">1. Cryptographic HMAC-SHA256 signature calculated over timestamp + JSON body to eliminate replay attacks.</text>
      <text x="24" y="94" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">2. Exponential backoff retry: 5 attempts (1s, 5s, 30s, 5m, 1h) before moving payload to Dead Letter Queue (DLQ).</text>
