        <text x="24" y="52" fill="#52525b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">https://api.cloudflare.com/client/v4/zones/.../purge_cache</text>
        <rect x="440" y="26" width="150" height="24" rx="4" fill="#18181c" stroke="#e4e4e7" stroke-width="1"/>
