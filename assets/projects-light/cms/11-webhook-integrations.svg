        <text x="510" y="42" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle">article.url_published</text>
        <text x="740" y="42" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">API Key Header</text>
        <text x="960" y="42" fill="#18181b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Today 00:32 (45ms)</text>
        <rect x="1150" y="26" width="90" height="24" rx="4" fill="#09090b" fill-opacity="0.12"/>
        <text x="1195" y="42" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600" text-anchor="middle">200 OK</text>
      </g>

      <!-- Row 4 -->
