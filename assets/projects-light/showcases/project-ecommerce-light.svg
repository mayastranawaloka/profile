    <rect x="720" y="70" width="280" height="200" rx="2" fill="#f4f4f5"/>
    <polygon points="860,110 810,210 910,210" fill="#e4e4e7"/>
    <text x="720" y="300" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Brass Geometric Bookend</text>
    <text x="720" y="322" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Solid Milled Metal Pair</text>
    <text x="1000" y="315" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="end">Rp 890.000</text>
