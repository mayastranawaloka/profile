    <line x1="30" y1="430" x2="360" y2="430" stroke="#e4e4e7" stroke-width="1"/>

    <text x="30" y="465" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">TOTAL</text>
    <text x="360" y="465" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="800" text-anchor="end">Rp 2.380.000</text>

    <!-- Payment Gateway Badges -->
