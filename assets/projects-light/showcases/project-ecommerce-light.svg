    <text x="195" y="525" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="700" letter-spacing="1" text-anchor="middle">INSTANT CHECKOUT (QRIS / VA)</text>

