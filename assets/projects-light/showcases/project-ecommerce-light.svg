    <text x="105" y="312" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Rp 1.250.000</text>

    <line x1="30" y1="340" x2="360" y2="340" stroke="#e4e4e7" stroke-width="1"/>

    <!-- Summary -->
