    <text x="360" y="375" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" text-anchor="end">Rp 2.380.000</text>

    <text x="30" y="405" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Insured Courier (JNE/SiCepat)</text>
