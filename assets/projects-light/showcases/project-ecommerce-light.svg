    <text x="370" y="300" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600">Acoustic Wool Desk Mat</text>
    <text x="370" y="322" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Organic Felt Surface 900x400</text>
    <text x="650" y="315" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="end">Rp 390.000</text>

    <!-- Product 3 -->
