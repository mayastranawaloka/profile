<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Browser Header Bar -->
  <rect width="1600" height="52" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="36" cy="26" r="6" fill="#e4e4e7"/>
  <circle cx="56" cy="26" r="6" fill="#e4e4e7"/>
  <circle cx="76" cy="26" r="6" fill="#e4e4e7"/>
  <rect x="520" y="14" width="560" height="24" rx="4" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="800" y="30" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">https://store.mayastranawaloka.com/curated-edition</text>

  <!-- Store Navigation Bar -->
  <rect y="52" width="1600" height="70" fill="#fafafa" stroke="#f4f4f5" stroke-width="1"/>
