<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" fill="none">
  <!-- Background -->
  <rect width="1600" height="1000" fill="#ffffff"/>

  <!-- Browser Header Bar -->
  <rect width="1600" height="52" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
  <circle cx="36" cy="26" r="6" fill="#e4e4e7"/>
  <circle cx="56" cy="26" r="6" fill="#e4e4e7"/>
  <circle cx="76" cy="26" r="6" fill="#e4e4e7"/>
  <rect x="520" y="14" width="560" height="24" rx="4" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
  <text x="800" y="30" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="middle" letter-spacing="1">https://store.mayastranawaloka.com/orders/track/KRN-88201</text>

  <!-- Store Navigation Bar -->
  <rect y="52" width="1600" height="70" fill="#fafafa" stroke="#f4f4f5" stroke-width="1"/>
  <text x="80" y="94" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16" font-weight="800" letter-spacing="3">KRONIK COMMERCE</text>

  <g transform="translate(480, 94)">
    <text x="0" y="0" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" letter-spacing="1.5">ALL OBJECTS</text>
    <text x="120" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"  letter-spacing="1.5">LIVING</text>
    <text x="240" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"  letter-spacing="1.5">HARDWARE</text>
    <text x="360" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"  letter-spacing="1.5">ARCHIVES</text>
    <text x="480" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12"  letter-spacing="1.5">EDITORIAL</text>
    
  </g>

  <!-- Currency & Cart -->
  <g transform="translate(1380, 94)">
    <text x="0" y="0" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" letter-spacing="1">IDR / EN</text>
    <rect x="80" y="-16" width="68" height="26" rx="13" fill="#09090b"/>
    <text x="114" y="1" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="700" text-anchor="middle">BAG (3)</text>
  </g>

  <!-- Order Milestone Tracker -->
  <g transform="translate(80, 150)">
    <rect x="0" y="0" width="1440" height="780" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
    
    <g transform="translate(48, 40)">
      <text x="0" y="24" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="22" font-weight="700">ORDER TRACKING #KRN-88201</text>
      <text x="0" y="50" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Carrier: SiCepat Cargo Express &#8226; Waybill: 0041-9982-1092-JKT</text>

      <!-- Milestone Timeline Progress Bar -->
      <g transform="translate(0, 90)">
        <rect x="0" y="20" width="1344" height="6" rx="3" fill="#f4f4f5"/>
        <rect x="0" y="20" width="1000" height="6" rx="3" fill="#09090b"/>

        <!-- Milestone 1 -->
        <circle cx="0" cy="23" r="10" fill="#09090b"/>
        <text x="0" y="55" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Order Placed</text>
        <text x="0" y="74" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">14 Nov 08:30 WIB</text>

        <!-- Milestone 2 -->
        <circle cx="336" cy="23" r="10" fill="#09090b"/>
        <text x="336" y="55" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Payment Verified</text>
        <text x="336" y="74" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">14 Nov 08:32 WIB</text>

        <!-- Milestone 3 -->
        <circle cx="672" cy="23" r="10" fill="#09090b"/>
        <text x="672" y="55" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Staged &amp; Packed</text>
        <text x="672" y="74" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">14 Nov 11:15 WIB</text>

        <!-- Milestone 4 (Active) -->
        <circle cx="1008" cy="23" r="12" fill="#09090b" stroke="#ffffff" stroke-width="3"/>
        <text x="1008" y="55" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700">Out for Delivery</text>
        <text x="1008" y="74" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Courier En Route (South JKT)</text>

        <!-- Milestone 5 -->
        <circle cx="1344" cy="23" r="10" fill="#f4f4f5"/>
        <text x="1344" y="55" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" text-anchor="end">Delivered</text>
        <text x="1344" y="74" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" text-anchor="end">Est. Today 15:00</text>
      </g>

      <!-- Live GPS Dispatch Log -->
      <g transform="translate(0, 220)">
        <rect x="0" y="0" width="1344" height="420" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="32" y="36" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">REAL-TIME COURIER TELEMETRY DISPATCHES</text>

        <g transform="translate(32, 60)">
          <line x1="0" y1="20" x2="1280" y2="20" stroke="#e4e4e7"/>
          <text x="0" y="46" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">14 Nov 13:42 WIB</text>
          <text x="180" y="46" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Courier [Hendra] is 1.8 km from destination address (Jl. Senopati, Kebayoran Baru)</text>

          <line x1="0" y1="70" x2="1280" y2="70" stroke="#e4e4e7"/>
          <text x="0" y="96" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">14 Nov 12:10 WIB</text>
          <text x="180" y="96" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Package departed South Jakarta Delivery Station (Duren Tiga Hub)</text>

          <line x1="0" y1="120" x2="1280" y2="120" stroke="#e4e4e7"/>
          <text x="0" y="146" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">14 Nov 10:20 WIB</text>
          <text x="180" y="146" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Consignment scanned at Central Sorting Facility (Halim Logistics Hub)</text>
        </g>
      </g>
    </g>
  </g>
</svg>