      <text x="0" y="48" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12">Real-time revenue telemetry, conversion cohorts, and average order value metrics</text>

      <!-- 4 Top Cards -->
      <g transform="translate(0, 80)">
        <rect x="0" y="0" width="320" height="110" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="24" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">DAILY GMV</text>
        <text x="24" y="68" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">Rp 48.250.000</text>
        <text x="24" y="92" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">+24.2% vs yesterday</text>

        <rect x="345" y="0" width="320" height="110" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="369" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CONVERSION RATE</text>
        <text x="369" y="68" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">4.82 %</text>
        <text x="369" y="92" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Benchmark: 2.1%</text>

        <rect x="690" y="0" width="320" height="110" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="714" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">AVG ORDER VALUE (AOV)</text>
        <text x="714" y="68" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">Rp 820.000</text>
        <text x="714" y="92" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Bundling engine active</text>

        <rect x="1035" y="0" width="325" height="110" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="1059" y="32" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" font-weight="600">CHECKOUT SPEED</text>
        <text x="1059" y="68" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="24" font-weight="800">84 ms TTFB</text>
        <text x="1059" y="92" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Sub-second transaction commit</text>
      </g>

      <!-- Funnel Chart -->
      <g transform="translate(0, 220)">
        <rect x="0" y="0" width="1360" height="460" rx="6" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="32" y="36" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700">CONVERSION FUNNEL DROP-OFF AUDIT</text>

        <!-- Funnel bars -->
        <g transform="translate(32, 70)">
          <text x="0" y="24" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">1. Storefront Visits: 142,000 Sessions</text>
          <rect x="0" y="36" width="1290" height="30" rx="4" fill="#09090b"/>

          <text x="0" y="104" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">2. Product Detail Views: 64,800 Users (45.6%)</text>
          <rect x="0" y="116" width="588" height="30" rx="4" fill="#09090b" fill-opacity="0.8"/>

          <text x="0" y="184" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">3. Added to Shopping Bag: 14,200 Carts (21.9%)</text>
          <rect x="0" y="196" width="282" height="30" rx="4" fill="#09090b" fill-opacity="0.6"/>

          <text x="0" y="264" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">4. Completed Payment: 6,840 Transactions (48.1% of checkout)</text>
          <rect x="0" y="276" width="136" height="30" rx="4" fill="#09090b" fill-opacity="0.4"/>
        </g>
      </g>
    </g>
  </g>
</svg>