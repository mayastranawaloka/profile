          <text x="24" y="34" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Direct Courier Guarantee</text>
          <text x="24" y="56" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">Same-day dispatch from Jakarta fulfillment hub before 16:00 WIB</text>

          <text x="24" y="94" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Breakage Transit Insurance</text>
          <text x="24" y="116" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11">100% replacement guarantee if damaged during shipping transit</text>

          <text x="24" y="150" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">Authentic Studio Provenance</text>
