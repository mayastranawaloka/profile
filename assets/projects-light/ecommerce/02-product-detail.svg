        <!-- Description -->
        <text x="0" y="150" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" line-height="22">Meticulously thrown stoneware vessel finished in a tactile matte obsidian</text>
        <text x="0" y="172" fill="#27272a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13">glaze. Fired at 1280&#176;C for maximum structural density and watertight seal.</text>

        <!-- Variant Selector -->
