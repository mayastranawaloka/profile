        <rect x="0" y="330" width="100" height="44" rx="4" fill="#f4f4f5" stroke="#e4e4e7" stroke-width="1"/>
        <text x="20" y="357" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">-</text>
        <text x="50" y="357" fill="#09090b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
        <text x="80" y="357" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="16">+</text>

        <rect x="120" y="330" width="340" height="44" rx="4" fill="#09090b"/>
        <text x="290" y="357" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">ADD TO SHOPPING BAG</text>

